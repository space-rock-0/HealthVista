name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      prisma: ${{ steps.filter.outputs.prisma }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'package*.json'
              - 'vitest.config.ts'
              - 'docs/architecture/security.md'
              - '.github/workflows/ci.yml'
            client:
              - 'apps/client/**'
              - 'packages/shared/**'
              - 'package*.json'
              - '.github/workflows/ci.yml'
            prisma:
              - 'apps/server/prisma/**'
              - '.github/workflows/ci.yml'

  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run build -w packages/shared
      - run: npm run db:generate -w apps/server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: /api

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.server == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medicore
          POSTGRES_PASSWORD: medicore
          POSTGRES_DB: medicore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medicore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://medicore:medicore@localhost:5432/medicore_test
      DIRECT_URL: postgresql://medicore:medicore@localhost:5432/medicore_test
      REDIS_URL: redis://localhost:6379
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters_long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run db:generate -w apps/server
      - run: npm run db:deploy
      - run: npm run test:server -- --coverage
        id: tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.tests.outcome != 'skipped'
        with:
          name: server-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  test-client:
    name: Client tests & build
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.client == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run test -w apps/client -- --coverage
        id: tests
      - run: npm run build -w apps/client
        env:
          VITE_API_URL: /api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.tests.outcome != 'skipped'
        with:
          name: client-coverage
          path: apps/client/coverage
          retention-days: 7
          if-no-files-found: ignore

  prisma-check:
    name: Prisma schema
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.prisma == 'true'
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm exec -w apps/server -- prisma validate
      - name: Check schema formatting
        run: |
          npm exec -w apps/server -- prisma format
          git diff --exit-code -- apps/server/prisma/schema.prisma
      - name: Require migrations for schema changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if ! git diff -w --quiet "$BASE_SHA" HEAD -- apps/server/prisma/schema.prisma; then
              if ! git diff --name-only "$BASE_SHA" HEAD | grep -q 'apps/server/prisma/migrations/'; then
                echo "::error::Schema changed without a migration. Run npm run db:migrate."
                exit 1
              fi
            fi
          fi

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [changes, quality, test-server, test-client, prisma-check, security]
    if: always()
    steps:
      - name: Check required job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All required checks passed."
